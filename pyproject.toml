[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-witness"
version = "0.9.0"
description = "Immutable audit trail MCP server for AI decisions - cryptographic proof of what your AI did, when, and why"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Edwin Isac", email = "edwinisac007@gmail.com"}
]
keywords = ["mcp", "audit", "compliance", "soc2", "hipaa", "gdpr", "ai", "logging", "immutable"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Logging",
]

dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.2.0",
    "black>=24.0.0",
]
postgres = [
    "asyncpg>=0.29.0",
]

[project.scripts]
mcp-witness = "mcp_witness.cli:main"
mcp-witness-sbom = "mcp_witness.cli:cmd_sbom"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.coverage.run]
source = ["src/mcp_witness"]
branch = true
omit = [
    # Integration / end-to-end modules (tested via CI jobs, not unit tests)
    "src/mcp_witness/cli.py",
    "src/mcp_witness/storage_pg.py",       # Requires PostgreSQL (tested in test-postgres job)
    "src/mcp_witness/dashboard/server.py",  # Web server (tested via dashboard job)
    "src/mcp_witness/dashboard/__init__.py",
    "src/mcp_witness/logging.py",           # Config helper, tested implicitly
    "src/mcp_witness/webhook.py",            # I/O tested via integration
    "src/mcp_witness/reports/__init__.py",   # HTML/PDF generation (tested via report job)
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]  # assert OK in production code if intentional

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_configs = true
warn_return_any = true

# storage.py and storage_pg.py use the Optional[Connection] = None pattern for async
# DB connections (set in connect(), never None after that). Suppressing the false-positive
# union-attr and index errors lets mypy stay fast while real errors in other modules
# remain visible. Revisit when migrating to a fully-typed DB adapter.
[[tool.mypy.overrides]]
module = ["mcp_witness.storage", "mcp_witness.storage_pg"]
disable_error_code = ["union-attr", "index", "no-any-return", "arg-type", "assignment", "override", "return-value", "attr-defined"]
