name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1" # Weekly Monday morning health check

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Fast lane: lint + format + quick test ──────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - run: uv pip install --system ruff black
      - name: Ruff lint
        run: ruff check src/ tests/
      - name: Black format check
        run: black --check src/ tests/

  # ── Unit tests: all Python versions ────────────────────────────────────────
  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -q \
            --cov=mcp_witness \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=65 \
            --ignore=tests/test_storage_pg.py

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ── PostgreSQL integration tests ───────────────────────────────────────────
  test-postgres:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: witness
          POSTGRES_PASSWORD: witness_test
          POSTGRES_DB: witness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev,postgres]"

      - name: Run PostgreSQL integration tests
        env:
          MCP_WITNESS_BACKEND: postgresql
          MCP_WITNESS_PG_URL: postgresql://witness:witness_test@localhost:5432/witness_test
        run: |
          pytest tests/ -q -k "pg" -v

  # ── Security audit ─────────────────────────────────────────────────────────
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - name: Install + audit dependencies
        run: |
          uv pip install --system pip-audit
          uv pip install --system -e ".[dev,postgres]"
          pip-audit 2>&1 | tail -20

  # ── Build verification ─────────────────────────────────────────────────────
  build:
    needs: [test, test-postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - name: Build package
        run: |
          uv pip install --system build
          python -m build
      - name: Verify package
        run: |
          uv pip install --system dist/*.whl
          mcp-witness --version
          mcp-witness --help
