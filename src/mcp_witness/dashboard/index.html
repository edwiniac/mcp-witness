<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔐 MCP Witness — Audit Trail Dashboard</title>
<style>
  :root {
    --bg: #0a0e14;
    --surface: #141b22;
    --surface2: #1c2430;
    --border: #2a3340;
    --text: #cdd6e0;
    --text2: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --red: #f85149;
    --yellow: #d2991d;
    --purple: #a371f7;
    --radius: 8px;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
  }
  .container { max-width:1100px; margin:0 auto; padding:24px 20px; }
  header { 
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
  }
  header h1 { font-size: 1.5rem; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .version { font-size: 0.75rem; color: var(--text2); background: var(--surface2); padding: 2px 8px; border-radius: 4px; }
  .badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
  .badge-ok { background: #1a3a1a; color: var(--green); border: 1px solid #2a5a2a; }
  .badge-err { background: #3a1a1a; color: var(--red); border: 1px solid #5a2a2a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px; margin-bottom: 32px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; }
  .card .label { font-size: 0.75rem; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; }
  .card .value { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .card .accent { color: var(--accent); }
  .sections { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 32px; }
  @media (max-width: 768px) { .sections { grid-template-columns: 1fr; } }
  .section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .section h2 { padding: 16px 20px; font-size: 0.9rem; font-weight: 600; border-bottom: 1px solid var(--border); background: var(--surface2); }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  th { text-align: left; padding: 10px 20px; color: var(--text2); font-weight: 500; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; background: #111820; }
  td { padding: 10px 20px; border-top: 1px solid var(--border); }
  tr:hover td { background: #1a2230; }
  .hash { font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.75rem; color: var(--text2); }
  .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.7rem; font-weight: 500; }
  .tag-tool_call { background: #1a2a3a; color: var(--accent); }
  .tag-decision { background: #2a1a3a; color: var(--purple); }
  .tag-output { background: #1a3a2a; color: var(--green); }
  .tag-error { background: #3a1a1a; color: var(--red); }
  .tag-snapshot { background: #3a3a1a; color: var(--yellow); }
  .tag-pii, .tag-phi, .tag-confidential { background: #3a1a1a; color: var(--red); }
  .tag-internal { background: #1a2a3a; color: var(--accent); }
  .tag-public { background: #1a3a2a; color: var(--green); }
  .bar-group { margin-bottom: 10px; }
  .bar-label { display: flex; justify-content: space-between; margin-bottom: 4px; font-size: 0.8rem; }
  .bar-track { height: 8px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
  .checkpoint-card { padding: 12px 20px; border-bottom: 1px solid var(--border); }
  .checkpoint-card:last-child { border-bottom: none; }
  .checkpoint-header { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .empty { padding: 40px 20px; text-align: center; color: var(--text2); font-size: 0.9rem; }
  footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--border); text-align: center; font-size: 0.75rem; color: var(--text2); }
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>🔐 MCP Witness <span class="version">v1.0.0</span></h1>
      <p style="color:var(--text2);font-size:0.85rem;margin-top:4px;">Immutable audit trail for AI decisions</p>
    </div>
    <div id="chain-status"></div>
  </header>

  <div class="grid" id="stats-grid"></div>

  <div class="sections">
    <div class="section">
      <h2>📋 Recent Records</h2>
      <div id="recent-records"></div>
    </div>
    <div class="section">
      <h2>📦 Recent Checkpoints</h2>
      <div id="recent-checkpoints"></div>
    </div>
  </div>

  <div class="sections">
    <div class="section">
      <h2>📊 Actions by Type</h2>
      <div id="actions-chart" style="padding:20px;"></div>
    </div>
    <div class="section">
      <h2>🛡️ Sensitivity Distribution</h2>
      <div id="sensitivity-chart" style="padding:20px;"></div>
    </div>
  </div>

  <footer>
    MCP Witness · Cryptographic audit trails for AI · <span id="footer-stats"></span>
  </footer>
</div>

<script>
// Colors for chart bars
const BAR_COLORS = ['#58a6ff','#3fb950','#d2991d','#f85149','#a371f7','#79c0ff','#56d364'];

// Escape untrusted values before interpolating into innerHTML (XSS defense)
function esc(v) {
  return String(v ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#x27;');
}

// CSS class suffixes must be strictly alphanumeric/underscore
function cssToken(v) {
  return String(v ?? '').replace(/[^a-zA-Z0-9_-]/g, '');
}

async function load() {
  try {
    // Try loading from API endpoint, fall back to demo data
    let data;
    try {
      const resp = await fetch('/api/dashboard');
      if (resp.ok) data = await resp.json();
    } catch (e) {}
    
    if (!data) {
      // Demo fallback — in production, serve via mcp-witness or API
      data = {
        total_records: 0,
        chain_valid: true,
        unique_sessions: 0,
        unique_actors: 0,
        attested_records: 0,
        actions_by_type: {},
        sensitivity_levels: {},
        total_checkpoints: 0,
        total_anchors: 0,
        recent_records: [],
        recent_checkpoints: [],
        verification: { valid: true, records_checked: 0, issues: [] }
      };
      document.querySelector('header').insertAdjacentHTML('beforeend',
        '<div style="font-size:0.75rem;color:var(--yellow);background:#2a2a1a;padding:4px 12px;border-radius:4px;">📡 Demo mode — connect a witness DB</div>');
    }
    
    render(data);
  } catch (e) {
    document.body.innerHTML = '<div class="container"><p style="color:var(--red)"></p></div>';
    document.body.querySelector('p').textContent = 'Failed to load dashboard: ' + e.message;
  }
}

function render(d) {
  // Chain status badge
  document.getElementById('chain-status').innerHTML = d.chain_valid
    ? '<span class="badge badge-ok">✅ Chain Verified</span>'
    : '<span class="badge badge-err">❌ Chain Broken</span>';

  // Stats grid
  document.getElementById('stats-grid').innerHTML = [
    { label: 'Total Records', value: d.total_records.toLocaleString() },
    { label: 'Sessions', value: d.unique_sessions.toLocaleString() },
    { label: 'Actors', value: d.unique_actors.toLocaleString() },
    { label: 'Attested', value: d.attested_records.toLocaleString() },
    { label: 'Checkpoints', value: d.total_checkpoints.toLocaleString() },
    { label: 'Anchors', value: d.total_anchors.toLocaleString() },
  ].map(m => `<div class="card"><div class="label">${m.label}</div><div class="value accent">${m.value}</div></div>`).join('');

  // Recent records table
  if (d.recent_records.length > 0) {
    document.getElementById('recent-records').innerHTML = '<table>' +
      '<thead><tr><th>Seq</th><th>Type</th><th>Tool</th><th>Sensitivity</th><th>Hash</th><th>Time</th></tr></thead>' +
      '<tbody>' + d.recent_records.map(r =>
        `<tr>
          <td>#${esc(r.sequence)}</td>
          <td><span class="tag tag-${cssToken(r.action_type)}">${esc(r.action_type)}</span></td>
          <td>${esc(r.tool_name || '—')}</td>
          <td><span class="tag tag-${cssToken(r.sensitivity)}">${esc(r.sensitivity)}</span></td>
          <td class="hash">${esc(r.record_hash)}</td>
          <td style="font-size:0.75rem;color:var(--text2);">${esc(new Date(r.timestamp).toLocaleTimeString())}</td>
        </tr>`
      ).join('') + '</tbody></table>';
  } else {
    document.getElementById('recent-records').innerHTML = '<div class="empty">No records yet. Start recording AI actions.</div>';
  }

  // Recent checkpoints
  if (d.recent_checkpoints.length > 0) {
    document.getElementById('recent-checkpoints').innerHTML = d.recent_checkpoints.map(cp =>
      `<div class="checkpoint-card">
        <div class="checkpoint-header">
          <strong>Checkpoint #${esc(cp.id)}</strong>
          <span style="font-size:0.7rem;color:var(--text2);">${esc(cp.record_count)} records</span>
        </div>
        <div class="hash">Root: ${esc(cp.merkle_root)}</div>
        <div style="font-size:0.7rem;color:var(--text2);">Records ${esc(cp.from_sequence)}–${esc(cp.to_sequence)} · ${esc(new Date(cp.created_at).toLocaleDateString())}</div>
      </div>`
    ).join('');
  } else {
    document.getElementById('recent-checkpoints').innerHTML = '<div class="empty">No checkpoints yet. Records checkpoint every 1000 writes.</div>';
  }

  // Bar charts
  renderBars('actions-chart', d.actions_by_type);
  renderBars('sensitivity-chart', d.sensitivity_levels);

  // Footer
  document.getElementById('footer-stats').textContent = 
    `${d.verification.records_checked.toLocaleString()} records verified · ${d.verification.valid ? 'all valid' : d.verification.issues.length + ' issues'}`;
}

function renderBars(id, data) {
  if (!data || Object.keys(data).length === 0) {
    document.getElementById(id).innerHTML = '<div class="empty">No data yet</div>';
    return;
  }
  const total = Object.values(data).reduce((a,b) => a+b, 0);
  document.getElementById(id).innerHTML = Object.entries(data)
    .sort((a,b) => b[1] - a[1])
    .map(([k,v], i) => {
      const pct = total > 0 ? Math.round(v/total*100) : 0;
      return `<div class="bar-group">
        <div class="bar-label"><span>${esc(k)}</span><span>${esc(v)} (${pct}%)</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.max(pct,2)}%;background:${BAR_COLORS[i%7]}"></div></div>
      </div>`;
    }).join('');
}

load();
</script>
</body>
</html>
